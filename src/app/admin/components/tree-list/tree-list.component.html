<div class="tree-list-container">
  <ion-searchbar
    [(ngModel)]="searchQuery"
    (ionInput)="onSearchChange()"
    placeholder="Search by name, scientific name, or commemoration"
    debounce="300"
  ></ion-searchbar>

  <ion-text color="medium" class="tree-count">
    <p>{{ filteredTrees.length }} trees</p>
  </ion-text>

  <ion-list>
    @for (tree of filteredTrees; track tree.treeId) {
    <ion-item-sliding>
      <ion-item>
        <ion-label>
          <h2>{{ tree.commonName }}</h2>
          <p class="scientific-name">{{ tree.scientificName }}</p>
          @if (tree.commemoration && tree.commemoration.trim()) {
          <p class="commemoration">
            {{ tree.commemoration }}
          </p>
          }
        </ion-label>
        <ion-note slot="end">ID: {{ tree.treeId }}</ion-note>
      </ion-item>

      <ion-item-options side="end">
        <ion-item-option color="primary" (click)="onEdit(tree)">
          <ion-icon name="create-outline" slot="icon-only"></ion-icon>
        </ion-item-option>
        <ion-item-option color="danger" (click)="onDelete(tree)">
          <ion-icon name="trash-outline" slot="icon-only"></ion-icon>
        </ion-item-option>
      </ion-item-options>
    </ion-item-sliding>
    }
  </ion-list>

  @if (filteredTrees.length === 0) {
  <ion-text color="medium" class="no-results">
    <p>No trees found</p>
  </ion-text>
  }
</div>
