<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="cancel()">Cancel</ion-button>
    </ion-buttons>
    <ion-title>{{ title }}</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="save()" [strong]="true">Save</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form [formGroup]="form">
    <ion-list>
      <ion-item>
        <ion-input
          label="Common Name *"
          labelPlacement="stacked"
          formControlName="commonName"
          placeholder="e.g., White Oak"
        ></ion-input>
      </ion-item>
      <ion-text color="danger" *ngIf="form.get('commonName')?.touched && form.get('commonName')?.invalid">
        <p class="error-text">Common name is required</p>
      </ion-text>

      <ion-item>
        <ion-input
          label="Scientific Name *"
          labelPlacement="stacked"
          formControlName="scientificName"
          placeholder="e.g., Quercus alba"
        ></ion-input>
      </ion-item>
      <ion-text color="danger" *ngIf="form.get('scientificName')?.touched && form.get('scientificName')?.invalid">
        <p class="error-text">Scientific name is required</p>
      </ion-text>

      <ion-item>
        <ion-input
          label="Commemoration"
          labelPlacement="stacked"
          formControlName="commemoration"
          placeholder="Optional dedication or memory"
        ></ion-input>
      </ion-item>

      <ion-item>
        <ion-input
          label="Latitude *"
          labelPlacement="stacked"
          type="number"
          formControlName="lat"
          step="any"
        ></ion-input>
      </ion-item>
      <ion-text color="danger" *ngIf="form.get('lat')?.touched && form.get('lat')?.invalid">
        <p class="error-text">Latitude is required</p>
      </ion-text>

      <ion-item>
        <ion-input
          label="Longitude *"
          labelPlacement="stacked"
          type="number"
          formControlName="lng"
          step="any"
        ></ion-input>
      </ion-item>
      <ion-text color="danger" *ngIf="form.get('lng')?.touched && form.get('lng')?.invalid">
        <p class="error-text">Longitude is required</p>
      </ion-text>
    </ion-list>
  </form>
</ion-content>
